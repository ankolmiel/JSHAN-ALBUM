<style>
/* =========================
   GENERAL DESIGN
========================= */

* {
  box-sizing: border-box;
}

:root {
  --pink: #f5cbdc;
  --light-pink: #ffeaf2;
  --blue: #d8eaff;
  --light-blue: #eff7ff;
  --lavender: #e9e2fa;
  --text: #526381;
  --deep-pink: #c27f9d;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  overflow-x: hidden;
  font-family: Georgia, "Times New Roman", serif;
  color: var(--text);

  background:
    radial-gradient(ellipse at 10% 15%, #ffe5ef 0%, transparent 35%),
    radial-gradient(ellipse at 90% 25%, #c9e2ff 0%, transparent 38%),
    radial-gradient(ellipse at 50% 80%, #e6dcfa 0%, transparent 40%),
    linear-gradient(135deg, #f9dce9, #dcecff, #f8e4ef);

  background-attachment: fixed;
}

/* =========================
   FLOATING BACKGROUND DECOR
========================= */

.decorations {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

.decor {
  position: absolute;
  opacity: 0.48;
  user-select: none;
  animation: float 7s ease-in-out infinite alternate;
}

.decor:nth-child(even) {
  animation-delay: -3s;
  animation-duration: 9s;
}

.decor:nth-child(3n) {
  animation-duration: 11s;
}

.d1  { top: 8%; left: 5%; font-size: 30px; }
.d2  { top: 18%; right: 7%; font-size: 25px; }
.d3  { top: 35%; left: 3%; font-size: 23px; }
.d4  { top: 49%; right: 4%; font-size: 32px; }
.d5  { top: 65%; left: 7%; font-size: 26px; }
.d6  { top: 78%; right: 8%; font-size: 24px; }
.d7  { top: 90%; left: 25%; font-size: 20px; }
.d8  { top: 12%; left: 45%; font-size: 19px; }
.d9  { top: 55%; left: 48%; font-size: 18px; }
.d10 { top: 85%; right: 30%; font-size: 25px; }
.d11 { top: 28%; left: 20%; font-size: 18px; }
.d12 { top: 72%; right: 20%; font-size: 20px; }
.d13 { top: 42%; right: 18%; font-size: 19px; }
.d14 { top: 5%; right: 30%; font-size: 22px; }
.d15 { top: 95%; right: 5%; font-size: 20px; }

@keyframes float {
  from {
    transform: translateY(0) rotate(-8deg);
  }
  to {
    transform: translateY(-18px) rotate(8deg);
  }
}

/* Soft decorative background circles */

.glow {
  position: fixed;
  width: 250px;
  height: 250px;
  border-radius: 50%;
  filter: blur(70px);
  opacity: 0.28;
  pointer-events: none;
  z-index: 0;
}

.glow-one {
  background: #f3aeca;
  top: 20%;
  left: -120px;
}

.glow-two {
  background: #91c6ff;
  bottom: 10%;
  right: -120px;
}

/* Keep website content above decorations */

header,
.gallery,
.hint,
footer {
  position: relative;
  z-index: 1;
}

/* =========================
   HEADER
========================= */

header {
  text-align: center;
  padding: 65px 20px 30px;
}

.eyebrow {
  color: #b77e9c;
  letter-spacing: 5px;
  font-size: 0.75rem;
  margin-bottom: 15px;
}

header h1 {
  margin: 0;
  color: #596f9b;
  font-size: clamp(2.3rem, 7vw, 4.5rem);
  font-weight: normal;
  text-shadow: 2px 3px 0 #ffffff9c;
  animation: fadeDown 1s ease both;
}

header p {
  color: #7b779c;
  font-size: 1rem;
  line-height: 1.8;
  max-width: 500px;
  margin: 18px auto 0;
}

.heart-divider {
  color: #c68baa;
  letter-spacing: 10px;
  margin-top: 22px;
  font-size: 1.1rem;
}

/* =========================
   PHOTO GALLERY
========================= */

.gallery {
  max-width: 1250px;
  margin: 30px auto 65px;
  padding: 25px;
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 55px 30px;
}

.photo {
  position: relative;
  padding-top: 25px;
  cursor: pointer;
  transform-origin: top center;
  animation: hangingSway 5s ease-in-out infinite alternate;
  transition: filter 0.3s ease;
}

.photo:nth-child(2n) {
  animation-delay: -2s;
}

.photo:nth-child(3n) {
  margin-top: 25px;
  animation-delay: -3s;
}

.photo:hover {
  z-index: 5;
  filter: drop-shadow(0 12px 15px #7185b644);
}

.photo:focus-visible {
  outline: 3px solid #9db9ee;
  outline-offset: 8px;
  border-radius: 5px;
}

/* String */

.photo::before {
  content: "";
  position: absolute;
  top: -13px;
  left: 50%;
  width: 2px;
  height: 43px;
  background: linear-gradient(#c2b0be, #9baed0);
  transform: translateX(-50%);
}

/* Nail */

.nail {
  position: absolute;
  top: -21px;
  left: calc(50% - 5px);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: linear-gradient(135deg, #d9c7d4, #8498bd);
  box-shadow: 0 2px 3px #53638145;
  z-index: 2;
}

.frame {
  position: relative;
  padding: 9px 9px 40px;
  background: linear-gradient(145deg, #fffefd, #fff6fb);
  border: 1px solid #ffffff;
  box-shadow: 0 8px 18px #7385a52b;
  border-radius: 3px;
  transform: rotate(var(--tilt, -3deg));
  transition: transform 0.35s ease, box-shadow 0.35s ease;
}

.photo:hover .frame {
  transform: rotate(0deg) scale(1.05);
  box-shadow: 0 18px 28px #657eaa45;
}

.frame img {
  display: block;
  width: 100%;
  aspect-ratio: 3 / 4;
  object-fit: cover;
  background: #e4edfb;
  transition: filter 0.4s ease;
}

.photo:hover .frame img {
  filter: saturate(1.08) brightness(1.04);
}

.caption {
  position: absolute;
  left: 4px;
  right: 4px;
  bottom: 11px;
  color: #667496;
  text-align: center;
  font-size: 0.84rem;
}

/* Tiny heart on each photo */

.photo::after {
  content: "♡";
  position: absolute;
  right: -9px;
  bottom: -12px;
  color: #c88eaf;
  font-size: 21px;
  transform: rotate(12deg);
  transition: transform 0.3s;
}

.photo:hover::after {
  transform: rotate(-12deg) scale(1.3);
}

/* =========================
   GALLERY INSTRUCTIONS
========================= */

.hint {
  margin: 0 auto 65px;
  padding: 0 20px;
  text-align: center;
  color: #787ba1;
  font-style: italic;
  line-height: 1.8;
}

.hint span {
  color: #bd82a6;
}

/* =========================
   MEMORY POPUP
========================= */

.modal {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: #354360b9;
  backdrop-filter: blur(9px);
  -webkit-backdrop-filter: blur(9px);
  z-index: 20;
  overflow-y: auto;
}

.modal.show {
  display: flex;
}

.modal-content {
  position: relative;
  width: min(860px, 100%);
  max-height: 92vh;
  overflow-y: auto;
  display: grid;
  grid-template-columns: 1fr 1.05fr;
  align-items: start;
  gap: 25px;
  padding: 25px;
  border: 1px solid #ffffffd9;
  border-radius: 20px;
  background: linear-gradient(145deg, #fffafd, #edf5ff, #fcebf3);
  box-shadow: 0 25px 70px #24365355;
  animation: popup 0.35s ease;
}

.modal-photo {
  width: 100%;
  height: 100%;
  min-height: 300px;
  max-height: 490px;
  object-fit: cover;
  border-radius: 12px;
  box-shadow: 0 8px 22px #7d8fb52b;
}

.details {
  padding: 10px 3px;
  min-width: 0;
}

.eyebrow-small {
  color: #bd82a6;
  font-size: 0.73rem;
  letter-spacing: 3px;
}

.details h2 {
  margin: 12px 0;
  color: #596f9b;
  font-size: 1.8rem;
  font-weight: normal;
}

.song-name {
  padding: 11px 13px;
  margin: 15px 0 22px;
  color: #806c9c;
  background: #f5eaf8;
  border-left: 3px solid #a9bfe9;
  border-radius: 0 9px 9px 0;
  line-height: 1.6;
}

.details h3 {
  color: #6b789d;
  font-weight: normal;
  font-size: 1.15rem;
}

.lyrics {
  max-height: 240px;
  overflow-y: auto;
  white-space: pre-line;
  padding: 16px;
  color: #526381;
  background: linear-gradient(135deg, #edf5ff, #fcebf3);
  border: 1px solid #dbe4f5;
  border-radius: 12px;
  line-height: 1.85;
  font-size: 0.96rem;
  scrollbar-color: #a9bce0 #edf2fa;
}

.status {
  color: #9b7b9f;
  font-size: 0.83rem;
  line-height: 1.6;
  margin-top: 15px;
}

.close {
  position: sticky;
  float: right;
  top: 0;
  margin: -12px -12px 0 0;
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  color: #586c94;
  background: #e4edff;
  font-size: 1.5rem;
  cursor: pointer;
  z-index: 3;
  transition: transform 0.25s, background 0.25s;
}

.close:hover {
  background: #f4d4e4;
  transform: rotate(90deg);
}

/* =========================
   FOOTER
========================= */

footer {
  text-align: center;
  padding: 30px 15px 40px;
  color: #7a7c9f;
  line-height: 1.8;
}

footer .footer-heart {
  color: #c78baa;
  font-size: 1.2rem;
}

/* =========================
   ANIMATIONS
========================= */

@keyframes hangingSway {
  from { rotate: -1.3deg; }
  to { rotate: 1.3deg; }
}

@keyframes popup {
  from {
    opacity: 0;
    transform: translateY(15px) scale(0.97);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes fadeDown {
  from {
    opacity: 0;
    transform: translateY(-15px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================
   RESPONSIVE DESIGN
========================= */

@media (max-width: 950px) {
  .gallery {
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 45px 25px;
  }
}

@media (max-width: 600px) {
  header {
    padding-top: 45px;
  }

  .gallery {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    padding: 17px;
    gap: 38px 18px;
  }

  .frame {
    padding: 7px 7px 35px;
  }

  .caption {
    font-size: 0.75rem;
  }

  .modal {
    padding: 12px;
  }

  .modal-content {
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 18px;
    max-height: 94vh;
  }

  .modal-photo {
    min-height: 0;
    height: 230px;
  }

  .details h2 {
    font-size: 1.55rem;
  }

  .lyrics {
    max-height: 190px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

/* ==========================================
   GET WEBSITE ELEMENTS
========================================== */

const gallery = document.getElementById("gallery");
const modal = document.getElementById("modal");
const modalPhoto = document.getElementById("modalPhoto");
const memoryTitle = document.getElementById("memoryTitle");
const songName = document.getElementById("songName");
const lyrics = document.getElementById("lyrics");
const status = document.getElementById("status");
const music = document.getElementById("music");
const closeButton = document.getElementById("closeButton");

/* ==========================================
   CREATE THE 10 HANGING PHOTOS
========================================== */

memories.forEach((memory, index) => {
  const photo = document.createElement("article");

  photo.className = "photo";
  photo.tabIndex = 0;
  photo.setAttribute("role", "button");
  photo.setAttribute(
    "aria-label",
    `Open memory: ${memory.title}`
  );

  const tilts = [-4, 3, -2, 4, -3];
  photo.style.setProperty(
    "--tilt",
    `${tilts[index % tilts.length]}deg`
  );

  const nail = document.createElement("span");
  nail.className = "nail";

  const frame = document.createElement("div");
  frame.className = "frame";

  const img = document.createElement("img");
  img.src = memory.image;
  img.alt = memory.title;
  img.loading = "lazy";

  const caption = document.createElement("div");
  caption.className = "caption";
  caption.textContent = memory.title;

  frame.appendChild(img);
  frame.appendChild(caption);

  photo.appendChild(nail);
  photo.appendChild(frame);

  photo.addEventListener("click", () => {
    openMemory(index);
  });

  photo.addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
      event.preventDefault();
      openMemory(index);
    }
  });

  gallery.appendChild(photo);
});

/* ==========================================
   OPEN PHOTO, SHOW LYRICS, PLAY SONG
========================================== */

function openMemory(index) {
  const memory = memories[index];

  // Stop any previously playing song.
  music.pause();
  music.currentTime = 0;

  // Update popup content.
  modalPhoto.src = memory.image;
  modalPhoto.alt = memory.title;

  memoryTitle.textContent = memory.title;
  songName.textContent = memory.song;
  lyrics.textContent = memory.lyrics;

  // Show the popup.
  modal.classList.add("show");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";

  // Load the song assigned to this photo.
  music.src = memory.audio;
  music.load();

  status.textContent = "Loading your song ♡";

  // Play automatically after the photo is clicked.
  music.play()
    .then(() => {
      status.textContent = "Now playing ♡ Enjoy this memory.";
    })
    .catch(() => {
      status.textContent =
        "Song could not play. Check that the audio file exists in your songs folder.";
    });
}

/* ==========================================
   CLOSE POPUP AND STOP MUSIC
========================================== */

function closeMemory() {
  modal.classList.remove("show");
  modal.setAttribute("aria-hidden", "true");

  document.body.style.overflow = "";

  music.pause();
  music.currentTime = 0;
}

// Close using the X button.
closeButton.addEventListener("click", closeMemory);

// Close when clicking outside the popup.
modal.addEventListener("click", event => {
  if (event.target === modal) {
    closeMemory();
  }
});

// Close using Escape.
document.addEventListener("keydown", event => {
  if (
    event.key === "Escape" &&
    modal.classList.contains("show")
  ) {
    closeMemory();
  }
});
</script>
